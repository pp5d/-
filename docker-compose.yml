services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: aiqa
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aiqa_prod_password}
      POSTGRES_DB: aiqa
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aiqa"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    environment:
      APP_MODE: ${APP_MODE:-full}
      DATABASE_URL: postgresql+psycopg://aiqa:${POSTGRES_PASSWORD:-aiqa_prod_password}@db:5432/aiqa
      SECRET_KEY: ${SECRET_KEY}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY}
      PUBLIC_API_TOKEN: ${PUBLIC_API_TOKEN}
      CORS_ORIGINS: ${CORS_ORIGINS:-*}
      UPLOAD_DIR: /data/uploads
    volumes:
      - backend_data:/data
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"

  frontend:
    build: ./frontend
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  pgdata:
  backend_data:
